name: Backend CI/CD

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "halisaha-be/**"
      - ".github/workflows/be-ci-cd.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "halisaha-be/**"
      - ".github/workflows/be-ci-cd.yml"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/halisaha-be

defaults:
  run:
    working-directory: halisaha-be

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: halisaha
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('halisaha-be/**/*.gradle*', 'halisaha-be/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/halisaha
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be-test-reports
          path: halisaha-be/build/reports/tests
          retention-days: 7

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./halisaha-be
          file: ./halisaha-be/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/halisaha-be
            cat > /opt/halisaha-be/docker-compose.yml <<'EOF'
            services:
              app:
                image: ${{ env.IMAGE_NAME }}:latest
                container_name: halisaha-app
                restart: unless-stopped
                env_file:
                  - .env
                ports:
                  - "8080:8080"
            EOF
            cd /opt/halisaha-be
            docker compose pull
            docker compose up -d
            docker image prune -f
