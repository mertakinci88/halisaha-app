name: Frontend CI/CD

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "halisaha-fe/**"
      - ".github/workflows/fe-ci-cd.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "halisaha-fe/**"
      - ".github/workflows/fe-ci-cd.yml"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/halisaha-fe

defaults:
  run:
    working-directory: halisaha-fe

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: halisaha-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build-and-push:
    name: Build & Push Docker Image
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./halisaha-fe
          file: ./halisaha-fe/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-fe
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: halisaha-fe/docker-compose.prod.yml,halisaha-be/deploy/rollout.sh,halisaha-be/deploy/release.sh
          target: /tmp/halisaha-fe-deploy
          strip_components: 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN,IMAGE_TAG
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            mkdir -p /opt/halisaha-fe
            mv /tmp/halisaha-fe-deploy/docker-compose.prod.yml /opt/halisaha-fe/docker-compose.yml
            mv /tmp/halisaha-fe-deploy/deploy/rollout.sh /tmp/halisaha-fe-deploy/deploy/release.sh /opt/halisaha-fe/
            chmod +x /opt/halisaha-fe/rollout.sh /opt/halisaha-fe/release.sh
            cd /opt/halisaha-fe
            # Sürümlü + kesintisiz deploy (bkz. deploy/release.sh, deploy/rollout.sh)
            ./release.sh web "$IMAGE_TAG"
            docker image prune -f
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
