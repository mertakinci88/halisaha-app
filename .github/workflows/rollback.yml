name: Rollback

# Canlıdaki bir uygulamayı önceki bir sürüme (commit SHA etiketi) kesintisiz geri alır.
# Build gerekmez: imajlar GHCR'da zaten durur. Sürüm listesi sunucuda
# /opt/halisaha-<be|fe>/.deploy-history dosyasındadır (her başarılı deploy bir satır ekler).
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Geri alınacak uygulama"
        type: choice
        options: [be, fe]
        required: true
      version:
        description: "Dönülecek sürüm (commit SHA) ya da 'previous' (şu an çalışandan farklı en son sürüm)"
        type: string
        default: previous
        required: true

concurrency:
  group: deploy-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback ${{ inputs.app }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Rollback over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN,APP,VERSION
          script: |
            set -e
            case "$APP" in
              be) DIR=/opt/halisaha-be; SERVICE=app ;;
              fe) DIR=/opt/halisaha-fe; SERVICE=web ;;
              *) echo "Geçersiz uygulama: $APP"; exit 1 ;;
            esac
            if ! printf '%s' "$VERSION" | grep -Eq '^(previous|[0-9a-f]{7,40})$'; then
              echo "Geçersiz sürüm: $VERSION"; exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cd "$DIR"
            echo "Şu an çalışan: $(cat .current-tag 2>/dev/null || echo bilinmiyor)"
            ./release.sh "$SERVICE" "$VERSION"
            echo "Son kayıtlar:"; tail -5 .deploy-history
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
